name: emotion_companion
description: "治愈系心理健康情绪陪伴APP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  web: ^1.1.0
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  flutter_markdown: ^0.7.4
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  crypto: ^3.0.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.8.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/icons/
